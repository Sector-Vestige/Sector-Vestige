# From https://github.com/DeltaV-Station/Delta-v/
name: PR Changelogs

# No concurrency group: without a queue GitHub cancels pending runs, dropping the
# changelog of every PR merged mid-batch. Concurrent runs are safe because the
# commit step retries.

on:
  pull_request_target:
    types: [closed]

env:
  CHANGELOG_DIR: ${{ vars.CHANGELOG_DIR }}
  CHANGELOG_BRANCH: ${{ vars.CHANGELOG_BRANCH }}
  CHANGELOG_MESSAGE: ${{ vars.CHANGELOG_MESSAGE }}
  PR_NUMBER: ${{ github.event.number }}

jobs:
  changelog:
    runs-on: ubuntu-latest
    if: github.event.pull_request.merged == true
    permissions:
      contents: write
    steps:
      - name: Generate GitHub App Token
        id: generate-token
        uses: actions/create-github-app-token@v3
        with:
          app-id: ${{ secrets.APP_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}

      - name: Checkout Changelog Branch
        uses: actions/checkout@v5
        with:
          token: ${{ steps.generate-token.outputs.token }}
          ref: "${{ vars.CHANGELOG_BRANCH }}"

      - name: Setup Git
        run: |
          git config --global user.name "${{ secrets.WEH_BOT_USERNAME }}"
          git config --global user.email "${{ secrets.WEH_BOT_EMAIL }}"
        shell: bash

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 22.x
          cache: npm
          cache-dependency-path: Tools/changelog/package-lock.json

      - name: Install Dependencies
        run: npm ci
        working-directory: Tools/changelog
        shell: bash

      # Generating and committing share a step so a rejected push can start over
      # from the new branch tip. Rebasing instead conflicts every time: a
      # concurrent run appends to the same end of the file under the same id.
      - name: Generate and Commit Changelog
        env:
          GITHUB_TOKEN: ${{ steps.generate-token.outputs.token }}
        run: |
          set -euo pipefail

          for attempt in 1 2 3 4 5; do
            git fetch origin "${CHANGELOG_BRANCH}"
            git reset --hard "origin/${CHANGELOG_BRANCH}"

            (cd Tools/changelog && node changelog.js)

            # Stage only the generated changelog file, not a loose `*.yml` glob that —
            # with no root-level .yml files — falls through to git's recursive pathspec.
            git add "${CHANGELOG_DIR}"
            if git diff --staged --quiet; then
              echo "No changelog changes to commit."
              exit 0
            fi

            git commit -m "${CHANGELOG_MESSAGE} (#${PR_NUMBER})"

            if git push origin "HEAD:${CHANGELOG_BRANCH}"; then
              echo "Pushed changelog for PR #${PR_NUMBER} on attempt ${attempt}."
              exit 0
            fi

            echo "Push rejected on attempt ${attempt}/5 — another run got there first, retrying."
            sleep "$(( attempt * 5 ))"
          done

          echo "::error::Could not push the changelog for PR #${PR_NUMBER} after 5 attempts."
          exit 1
        shell: bash
