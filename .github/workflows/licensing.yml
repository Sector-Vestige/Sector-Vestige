name: Licensing

on:
  push:
    branches: [master, staging, stable]
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  merge_group:

permissions:
  contents: read

jobs:
  reuse:
    name: REUSE
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      # Structural check: every file has a license and copyright, and every
      # referenced license exists in LICENSES/.
      - name: reuse lint
        uses: fsfe/reuse-action@v6
      # Correctness check: the license REUSE computes for each _Fork/ and _SV/
      # file is the one REUSE.toml intends. `reuse lint` cannot see this;
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install reuse
        run: pip install --quiet reuse==6.2.0
      - name: Check computed licenses against REUSE.toml
        run: python Tools/reuse_check.py --verbose

  nc-assets:
    name: Non-commercial assets
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      # Fails only when an NC asset appears that is not in Tools/nc_assets_baseline.txt.
      - name: Check for new non-commercial assets
        run: python Tools/check_nc_assets.py --baseline
