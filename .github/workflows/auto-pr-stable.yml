name: "Auto PR: staging -> stable"

# Manually-triggered workflow that keeps a single open pull request proposing to
# merge everything new on `staging` into `stable`. Run it from the Actions tab
# whenever you want to (re)build the promotion PR. Running it again refreshes the
# overview in the body of the existing PR.

on:
  workflow_dispatch:

concurrency:
  group: auto-pr-staging-stable
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write

jobs:
  open-pr:
    runs-on: ubuntu-latest
    steps:
      # Full history, because the overview walks `stable..staging` along first
      # parents. blob:none and the sparse path keep that cheap.
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          filter: blob:none
          sparse-checkout: .github/scripts
          sparse-checkout-cone-mode: false

      - uses: actions/github-script@v8
        with:
          # Use a PAT (not the default GITHUB_TOKEN) so the resulting PR is
          # treated as user-created and triggers the normal CI workflows.
          github-token: ${{ secrets.WEH_BOT_PAT }}
          script: |
            const promotionOverview = require(`${process.env.GITHUB_WORKSPACE}/.github/scripts/promotion-overview.js`);
            await promotionOverview({
              github,
              context,
              core,
              base: 'stable',
              head: 'staging',
              labels: ['Branch: Stable', 'Maintenance'],
            });
