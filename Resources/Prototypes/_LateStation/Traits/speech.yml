# 1 cost - using the same point rules as vanilla.

# Sector Vestige: the "raised by" traits need `replaceComponents: true` (Harmony change on TraitPrototype),
# otherwise their Speech and TypingIndicator are ignored because the humanoid already has both.
# Vocal no longer holds per-sex sounds, so the emote sound bank is set through `voices` instead.

- type: trait
  id: ValleyGirl
  name: trait-valleygirl-name
  description: trait-valleygirl-desc
  category: SpeechTraits
  cost: 1
  components:
  - type: ValleyGirlAccent

- type: trait
  id: ScandinavianAccent
  name: trait-scandinavian-name
  description: trait-scandinavian-desc
  category: SpeechTraits
  cost: 1
  components:
  - type: ScandinavianAccent

# Might have to increase cost for the ones below...

- type: trait
  id: RaisedByArachnids
  name: trait-raisedbyarachnids-name
  description: trait-raisedbyarachnids-desc
  cost: 1
  category: SpeechTraits
  replaceComponents: true
  components:
  - type: Speech
    speechVerb: Arachnid
    speechSounds: Arachnid
    allowedEmotes: ['Click', 'Chitter']
  - type: TypingIndicator
    proto: spider
  voices:
    Male: UnisexArachnid
    Female: UnisexArachnid
    Unsexed: UnisexArachnid

