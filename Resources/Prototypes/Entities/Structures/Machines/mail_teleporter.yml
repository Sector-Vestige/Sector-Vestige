- type: entity
  id: CargoMailTeleporter
  parent: [ BaseMachinePowered, ConstructibleMachine, StructureHealthMachineStrong ]
  name: mail teleporter
  description: Periodically teleports in mail to deliver across the station.
  components:
  - type: Fixtures
    fixtures:
      fix1:
        shape:
          !type:PhysShapeAabb
          bounds: "-0.35,-0.35,0.35,0.35"
        density: 190
        mask:
        - MachineMask
        layer:
        - MachineLayer
  - type: Sprite
    sprite: Structures/mailbox.rsi
    snapCardinals: true
    layers:
    - state: icon
    - state: contents
      map: [ "enum.DeliverySpawnerVisualLayers.Contents" ]
      visible: false
    - state: unlit
      shader: unshaded
      visible: false
      map: [ "enum.PowerDeviceVisualLayers.Powered" ]
  - type: Damageable
    damageModifierSet: PlasteelMod
  - type: Destructible
    thresholds:
    - trigger: !type:DamageTrigger
        damage: 275
      behaviors:
      - !type:ChangeConstructionNodeBehavior
        node: machineFrame
      - !type:PlaySoundBehavior
        sound:
          collection: MetalBreak
  - type: ApcPowerReceiver
    powerLoad: 1000
  - type: Appearance
  - type: GenericVisualizer
    visuals:
      enum.DeliverySpawnerVisuals.Contents:
        enum.DeliverySpawnerVisualLayers.Contents:
          True: { visible: true }
          False: { visible: false }
      enum.PowerDeviceVisuals.Powered:
        enum.PowerDeviceVisualLayers.Powered:
          True: { visible: true }
          False: { visible: false }
  - type: Machine
    board: MailTeleporterMachineCircuitboard
  - type: PowerSwitch
  - type: InteractionPopup
    interactSuccessString: petting-success-mail-teleporter
    interactFailureString: petting-failure-mail-teleporter
  - type: DeliverySpawner
    table: !type:NestedSelector
      tableId: RandomDeliveryBasic
  #SV - Mail additions
  # ConstructibleMachine declares machine_board/machine_parts in its own ContainerContainer.
  # A child ContainerContainer replaces (does not merge) the parent's containers dict, so we
  # must re-list them here or OnMachineInit re-adds them at spawn and breaks UninitializedSaveTest.
  - type: ContainerContainer
    containers:
      maildeliveries: !type:Container
      machine_board: !type:Container
      machine_parts: !type:Container
