- type: entity
  id: DeathMatchPROMOD
  parent: BaseGameRule
  components:
  - type: DeathMatchRule
    gear: DeathMatchPROMODGear
    killCap: 16
    # Sector Vestige: RewardSpawns is now an EntityTableSelector (was a flat orGroup list).
    # AllSelector spawns every child; each GroupSelector picks one, matching the old orGroups.
    rewardSpawns: !type:AllSelector
      children:
      - id: MagazinePistol # guaranteed drops
      - !type:GroupSelector # 'loot' group: exactly one is picked
        children:
        - id: ClothingOuterArmorBasicSlim   # armor
        - id: ClothingOuterArmorBasic
        - id: ClothingOuterArmorBulletproof
        - id: ClothingOuterArmorReflective
        - id: WeaponPistolViper             # handguns
        - id: WeaponPistolCobra
        - id: WeaponRevolverInspector
        - id: WeaponRevolverPython
        - id: WeaponSubMachineGunC20r       # SMGs
        - id: WeaponSubMachineGunDrozd
        - id: WeaponSubMachineGunWt550
        - id: WeaponShotgunDoubleBarreled   # shotguns
        - id: WeaponShotgunSawn
        - id: WeaponShotgunKammerer
        - id: WeaponDisablerSMG             # energy weapons
        - id: WeaponLaserCarbine
        - id: WeaponLaserSvalinn
        - id: WeaponPistolCHIMPUpgraded
        #- id: MagazinePistolCaselessRifle   # ammo
        #- id: MagazinePistol
        #- id: SpeedLoaderMagnum
        #- id: MagazinePistolSubMachineGun
        #- id: MagazinePistolSubMachineGunTopMounted
        #- id: MagazineShotgun
        - id: GrenadeFlashBang              # grenades
        - id: SmokeGrenade
        - id: TearGasGrenade
        - id: EmpImplanter                  # implants
        - id: ScramImplanter
      - !type:GroupSelector # 'loothealing' group: exactly one is picked
        children:
        - id: EmergencyMedipen              # healing items
        - id: BruteAutoInjector
        - id: BurnAutoInjector
        - id: Stimpack
        - id: CombatMedipen
  - type: KillCalloutRule
  - type: PointManager
  - type: RespawnDeadRule
  - type: RespawnTracker
    respawnDelay: 5


# DeathMatch PROMOD Gear

- type: startingGear
  id: DeathMatchPROMODGear
  equipment:
    jumpsuit: ClothingUniformRandomStandard
    back: ClothingBackpack
    ears: ClothingHeadsetGrey
    gloves: ClothingHandsGlovesFingerless
    shoes: ClothingShoesBootsJack
    pocket1: MagazinePistol
    pocket2: MagazinePistol
  inhand:
    - WeaponPistolMk58
