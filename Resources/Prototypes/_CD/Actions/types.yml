# Foxfolk Tail Wagging
- type: entity
  parent: BaseToggleAction # Sector Vestige: needed for the Appearance/GenericVisualizer that drives the toggled icon
  id: ActionToggleFoxfolkakinWagging
  name: action-name-toggle-wagging
  description: action-description-toggle-wagging
  categories: [ HideSpawnMenu ]
  components:
    - type: Action
      itemIconStyle: NoItem
      useDelay: 1 # Prevents Emote Spam
    - type: Sprite
      sprite: _CD/Mobs/Customization/Foxfolk/tail_markings.rsi
      layers:
      - state: tail-wag-icon
        map: ["enum.ActionVisuals.Icon"]
      - state: tail-wag-icon
        map: ["enum.ActionVisuals.IconToggled"]
        visible: false
    - type: InstantAction
      event: !type:ToggleActionEvent

# Rodentia Mouth Storage
- type: entity
  id: ActionOpenMouthStorage
  name: Open cheek storage
  description: Allows you to store items in your cheeks.
  categories: [ HideSpawnMenu ]
  components:
  - type: Action
    itemIconStyle: BigAction
    priority: -10
  - type: Sprite
    layers:
    - texture: _CD/Interface/Actions/mouthStorageOpen.png
  - type: InstantAction
    event: !type:OpenStorageImplantEvent
