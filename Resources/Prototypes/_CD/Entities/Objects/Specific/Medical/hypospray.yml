- type: entity
  parent: [ChemicalMedipen, BaseMajorContraband]
  id: SecurityStimpack
  name: dynamoxine injector
  description: A smuggled injector containing a single ten-second dose of Dynamoxine. A label says not to take more then one at a time or with an Epi-Pen. Use it when you need to close the distance.
  components:
  - type: Item
    inhandVisuals:
      left:
      - state: base-needle-inhand-left
      - state: base-colorA-inhand-left
        color: "#FF9999"
      - state: base-colorB-inhand-left
      right:
      - state: base-needle-inhand-right
      - state: base-colorA-inhand-right
        color: "#FF9999"
      - state: base-colorB-inhand-right
  - type: Sprite
    sprite: _CD/Objects/Specific/Medical/medipen.rsi
    layers:
    - state: dynamoxine
      map: ["enum.SolutionContainerLayers.Fill"]
  - type: SolutionContainerVisuals
    maxFillLevels: 1
    changeColor: false
    emptySpriteName: dynamoxine_empty
  - type: Solution
    solution:
      maxVol: 5
      reagents:
        - ReagentId: Dynamoxine
          Quantity: 5
  - type: StaticPrice
    price: 500