- type: entity
  parent: [ BaseComputerAiAccess, BaseEngineeringContraband ]
  id: ComputerSupermatter
  name: supermatter monitoring console
  description: Used to monitor the status of supermatter crystals.
  components:
  - type: Computer
    board: SupermatterComputerCircuitboard
  - type: Sprite
    layers:
    - map: [ "enum.ComputerVisualLayers.Frame" ]
      state: computer
      sprite: _Impstation/Structures/Machines/computers.rsi
    - map: [ "enum.ComputerVisualLayers.Keyboard" ]
      state: generic_keyboard
      sprite: _Impstation/Structures/Machines/computers.rsi
    - map: [ "enum.ComputerVisualLayers.Screen" ]
      state: supermatter-0
      sprite: _Impstation/Structures/Machines/computers.rsi
    - map: [ "enum.ComputerVisualLayers.Keys" ]
      state: supermatter_keys
      sprite: _Impstation/Structures/Machines/computers.rsi
    - map: [ "enum.WiresVisualLayers.MaintenancePanel" ]
      state: generic_panel_open
      sprite: _Impstation/Structures/Machines/computers.rsi
  - type: ComputerVisuals # SV - upstream ComputerVisuals now sets the layer states
    stateFrame: computer
    stateKeyboard: generic_keyboard
    stateScreen: supermatter-0
    stateKeys: supermatter_keys
    statePanel: generic_panel_open
  - type: PointLight
    radius: 2.4
    energy: 1.6
    color: "#0f704b"
  - type: GenericVisualizer
    visuals:
      enum.ComputerVisuals.Powered:
        enum.ComputerVisualLayers.Screen:
          True: { visible: true, shader: unshaded }
          False: { visible: false }
        enum.ComputerVisualLayers.Keys:
          True: { visible: true, shader: unshaded }
          False: { visible: true, shader: shaded }
      enum.SupermatterConsoleVisuals.ComputerLayerScreen:
        enum.ComputerVisualLayers.Screen:
          0: { state: supermatter-0 }
          1: { state: supermatter-1 }
          2: { state: supermatter-2 }
          3: { state: supermatter-3 }
          4: { state: supermatter-4 }
          5: { state: supermatter-5 }
          6: { state: supermatter-6 }
      enum.WiresVisuals.MaintenancePanelState:
        enum.WiresVisualLayers.MaintenancePanel:
          True: { visible: false }
          False: { visible: true }
  - type: SupermatterConsole
  - type: ActivatableUI
    key: enum.SupermatterConsoleUiKey.Key
  - type: UserInterface
    interfaces:
        enum.SupermatterConsoleUiKey.Key:
            type: SupermatterConsoleBoundUserInterface
        enum.WiresUiKey.Key:
          type: WiresBoundUserInterface
