- type: soundCollection
  id: AvaliScreams
  files:
    - /Audio/_Floofstation/Voice/Avali/avali_scream.ogg

- type: soundCollection
  id: AvaliLaugh
  files:
    - /Audio/_Floofstation/Voice/Avali/avali_laugh.ogg

- type: emoteSounds
  id: MaleAvaliEmote
  voiceSelectorName: humanoid-profile-editor-voice-masculine # Sector Vestige: shown in the character editor
  params:
    variation: 0.125
  sounds:
    Scream:
      collection: AvaliScreams
    Laugh:
      collection: AvaliLaugh
    # Sector Vestige: bird noises instead of the human collections; there is no bird yawn or snore yet, so those stay silent
    Sneeze:
      path: /Audio/Voice/Vox/vox_sneeze.ogg
    Cough:
      path: /Audio/Voice/Vox/vox_cough.ogg
    Sigh:
      collection: HarpySigh
    Crying:
      collection: HarpyCry
    Gasp:
      collection: HarpyGasp
    DefaultDeathgasp:
      path: /Audio/Effects/Gasp/vox_DeathGasp.ogg
    CatMeow:
      collection: CatMeows
    CatHisses:
      collection: CatHisses
    MonkeyScreeches:
      collection: MonkeyScreeches
    RobotBeep:
      collection: RobotBeeps
    Honk:
      collection: BikeHorn
    Whistle:
      collection: Whistles
    Weh:
      collection: Weh
    Coo:
      collection: HarpyCoos
    Chirp:
      collection: HarpyChirps

