- type: entity
  parent: [SolutionWeapon, SolutionTiny]
  id: SolutionMyoVenom
  categories: [ HideSpawnMenu ]
  components:
  - type: SolutionRegeneration
    generated:
      reagents:
      - ReagentId: GastroToxin
        Quantity: 1

- type: entity
  id: MyoQueen
  parent: [ BaseMob, MobNightVision, SimpleSpaceMobBase, MobPolymorphable ]
  name: aberrant queen
  description: Flesh is pulsing out of its carapace.
  components:
  - type: Bloodstream
    bloodReferenceSolution:
      reagents:
      - ReagentId: Blood
        Quantity: 1500
  - type: Sprite
    drawdepth: Mobs
    sprite: _SV/Mobs/Demons/myoqueen.rsi
    offset: 0,0.4
    layers:
    - map: [ "enum.DamageStateVisualLayers.Base" ]
      state: alive
    - map: [ "enum.DamageStateVisualLayers.BaseUnshaded" ]
      state: eyes
      shader: unshaded
  - type: HTN
    rootTask:
      task: XenoCompound
    blackboard:
      NavClimb: !type:Bool
        true
      NavInteract: !type:Bool
        true
      NavPry: !type:Bool
        true
      NavSmash: !type:Bool
        true
  - type: Prying
    pryPowered: true
    force: true
    speedModifier: 1.5
    useSound:
      path: /Audio/Items/crowbar.ogg
  - type: Reactive
    groups:
      Flammable: [Touch]
      Extinguish: [Touch]
  - type: NpcFactionMember
    factions:
    - Xeno
  - type: FootstepModifier
    footstepSoundCollection:
      collection: BarestepHard
  - type: Tag
    tags:
    - CannotSuicide
    - DoorBumpOpener
    - FootstepSound
  - type: NoSlip
  - type: DamageStateVisuals
    states:
      Alive:
        Base: alive
        BaseUnshaded: eyes
      Critical:
        Base: crit
        BaseUnshaded: crit-eyes
      Dead:
        Base: dead
  - type: MobState
    allowedStates:
    - Alive
    - Critical
    - Dead
  - type: MobThresholds
    thresholds:
      0: Alive
      1200: Critical
      1500: Dead
  - type: MovementSpeedModifier
    baseWalkSpeed: 2.5
    baseSprintSpeed: 5
  - type: MeleeWeapon
    altDisarm: false
    soundHit:
      path: /Audio/_SV/Weapons/Xeno/myoqueen_bite.ogg
    angle: 45
    animation: WeaponArcBite
    wideAnimation: WeaponArcTailMyo
    wideAnimationRotation: 180
    damage:
      types:
        Slash: 12
        Structural: 30
    soundSwing:
      path: /Audio/_SV/Weapons/Xeno/myoqueen_swipe.ogg
  - type: Armor
    modifiers:
      coefficients:
        Piercing: 0.75
        Blunt: 0.3
        Slash: 0.5
        Heat: 0.95
        Cold: 1.3
  - type: PassiveDamage
    intervalHaltOnDamageTaken: 15s
    allowedStates:
    - Alive
    - Critical
    damage:
      types:
        Heat: -4
        Blunt: -3
        Piercing: -5
        Slash: -7.5
        Poison: -0.25
  - type: JumpAbility
    jumpDistance: 8
    jumpSound:
      collection: MyoLeap
  - type: Puller
    needsHands: false
  - type: Butcherable
    spawned:
    - id: FoodMeatXeno
      amount: 5
  - type: Speech
    speechVerb: Myo
    speechSounds: Myo
    allowedEmotes: [ 'Roar', 'Growl' ]
  - type: Vocal
    emoteSounds: MyoBodyEmotes
  - type: TypingIndicator
    proto: alien
  - type: TemperatureDamage
    heatDamageThreshold: 360
    coldDamageThreshold: -150
  - type: SolutionManager
    solutions:
    - SolutionMyoVenom
  - type: MeleeChemicalInjector
    transferAmount: 0.5
    solution: melee
  - type: Jaunt
    jauntAction: ActionPolymorphMyoJaunt
  - type: Insulated
