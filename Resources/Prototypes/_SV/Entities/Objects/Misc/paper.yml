- type: entity
  id: BusinessCard
  name: business card
  parent: Paper
  description: A eggshell card with usually contains personal information.
  components:
  - type: Sprite
    sprite: _SV/Objects/Misc/bureaucracy.rsi
    layers:
    - state: business_card
    - state: business_card_words
      map: ["enum.PaperVisualLayers.Writing"]
      visible: false
  - type: Item
    sprite: Objects/Misc/bureaucracy.rsi
    inhandVisuals:
      left:
      - state: paper-inhand-left
        color: "#f0ead6"
      right:
      - state: paper-inhand-right
        color: "#f0ead6"
  - type: Paper
  - type: PaperVisuals
    backgroundImagePath: "/Textures/Interface/Paper/paper_background_default.svg.96dpi.png"
    contentImagePath: "/Textures/Interface/Paper/paper_content_lined.svg.96dpi.png"
    backgroundModulate: "#f0ead6"
    contentImageModulate: "#f0ead6"
    backgroundPatchMargin: 16.0, 16.0, 16.0, 16.0
    contentMargin: 4.0, 4.0, 4.0, 4.0
    maxWritableArea: 400.0, 256.0

