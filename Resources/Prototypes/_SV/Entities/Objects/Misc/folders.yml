# Secure Folders
- type: entity
  parent: BoxBase
  id: BoxFolderSecureEmpty
  name: secure folder
  components:
  - type: Sprite
    sprite: _SV/Objects/Misc/folders.rsi
    layers:
    - state: securefolder-colormap
    - state: securefolder-zip
    - state: locked
      map: [ "enum.LockVisualLayers.Lock" ]
      shader: unshaded
    - state: folder-base
  - type: Item
    sprite: _SV/Objects/Misc/folders.rsi
    size: Small
    shape: null
    inhandVisuals:
      left:
      - state: inhand-left
      right:
      - state: inhand-right
  - type: Appearance
  - type: AccessReader
  - type: Lock
  - type: LockedStorage
  - type: LockVisuals
  - type: Storage
    maxItemSize: Small
    grid:
    - 0,0,4,3
    whitelist:
      tags:
      - Document
  - type: PhysicalComposition
    materialComposition:
      Paper: 50
      Steel: 20
  - type: StaticPrice
    price: 15
  - type: Tag
    tags:
    - Folder

- type: entity
  parent: BoxFolderSecureEmpty
  id: BoxFolderSecureRedEmpty
  suffix: Red
  components:
  - type: Sprite
    layers:
    - state: securefolder-colormap
      color: "#cc2323"
    - state: securefolder-zip
    - state: locked
      map: [ "enum.LockVisualLayers.Lock" ]
      shader: unshaded
    - state: folder-base
  - type: Item
    inhandVisuals:
      left:
      - state: inhand-left
        color: "#cc2323"
      right:
      - state: inhand-right
        color: "#cc2323"

