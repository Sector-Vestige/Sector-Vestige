# 100% AP bullet + gun
- type: entity
  id: BulletDebug100AP
  name: bang, hurt bullet
  parent: BaseBullet
  categories: [ Debug, HideSpawnMenu ]
  suffix: DEBUG, 100% AP
  components:
  - type: Projectile
    damage:
      types:
        Blunt: 10
      ignoreResistances: 1.0

- type: entity
  id: CartridgeDebug100AP
  name: bang, ded cartridge 100%AP
  parent: BaseCartridgePistol
  suffix: DEBUG
  components:
  - type: Tag
    tags:
    - CartridgeDebug
  - type: CartridgeAmmo
    proto: BulletDebug100AP

- type: entity
  id: MagazinePistolDebug100AP
  name: bang, ded mag 100%AP
  parent: BaseMagazinePistol
  suffix: DEBUG
  components:
  - type: Tag
    tags:
    - MagazineDebug
  - type: BallisticAmmoProvider
    proto: CartridgeDebug100AP
    capacity: 1000
  - type: Sprite
    sprite: Objects/Weapons/Guns/Ammunition/Magazine/Pistol/pistol_mag.rsi

