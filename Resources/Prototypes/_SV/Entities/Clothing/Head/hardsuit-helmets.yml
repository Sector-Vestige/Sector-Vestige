#R&D Recovery & Containment Team (RCT) HARDSUITS HELMETS
- type: entity
  parent: [ BaseCentcommContraband, ClothingHeadHelmetHardsuitSyndieCommander ]
  id: ClothingHeadHelmetHardsuitRCT
  name: RCT hardsuit helmet
  description: A special hardsuit helmet worn by members of an recovery and containment team.
  components:
  - type: Sprite
    sprite: _SV/Clothing/Head/Hardsuits/rnd_rct_helmets/rnd_rct_helmet_default.rsi
    # Sector Vestige: this rsi predates upstream renaming the light layer icon-flash -> light-overlay
    # (and adding icon-unshaded), so keep the icon/icon-flash layering the art was actually drawn for.
    layers:
    - state: icon
    - state: icon-flash
      visible: false
      map: [ "light" ]
  - type: Clothing
    sprite: _SV/Clothing/Head/Hardsuits/rnd_rct_helmets/rnd_rct_helmet_default.rsi
  - type: PointLight
    color: "#addbff"
  - type: Armor
    modifiers:
      coefficients:
        Blunt: 0.9
        Slash: 0.9
        Piercing: 0.9
        Heat: 0.9

#Animated Broken DS Hardsuit Helm.
- type: entity
  parent: ClothingHeadBase
  id: ClothingHeadHelmetHardsuitDeathsquadBroken
  name: deathsquad hardsuit helmet
  description: A robust helmet for special operations. This one has a large chunk taken out of it.
  components:
  - type: Sprite
    sprite: _SV/Clothing/Head/Hardsuits/deathsquad_broken.rsi
  - type: FireProtection
    reduction: 0.2
  - type: Armor
    modifiers:
      coefficients:
        Blunt: 0.80
        Slash: 0.80
        Piercing: 0.80
        Heat: 0.80
        Radiation: 0.80
        Caustic: 0.95
