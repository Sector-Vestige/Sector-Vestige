# Central Command documentation terminal — tabletop variant.
- type: entity
  parent: [ BaseStructureComputerTabletop, SVComputerCentralCommandDocuments ]
  id: SVComputerTabletopCentralCommandDocuments
  suffix: Tabletop
  components:
  - type: Sprite
    layers:
    - map: [ "enum.ComputerVisualLayers.Frame" ]
      sprite: _CD/Structures/Machines/Computers/tabletopcomputer.rsi
      state: computer_tabletop
    - map: [ "enum.ComputerVisualLayers.Keyboard" ]
      sprite: _CD/Structures/Machines/Computers/tabletopcomputer.rsi
      state: generic_keyboard_tabletop
    - map: [ "enum.ComputerVisualLayers.Screen" ]
      sprite: Structures/Machines/computers.rsi
      state: comm
    - map: [ "enum.ComputerVisualLayers.Keys" ]
      sprite: Structures/Machines/computers.rsi
      state: tech_key
  - type: ComputerVisuals # SV - upstream ComputerVisuals now sets the layer states
    stateFrame: computer_tabletop
    stateKeyboard: generic_keyboard_tabletop
    stateScreen: comm
    stateKeys: tech_key
    statePanel: null

