- type: antagSpecifier
  id: SyndicateListener
  spawnerPrototype: SpawnPointGhostSyndicateListener
  pickPlayer: false
  startingGear: SyndicateListenerGear
  roleLoadout:
  - RoleSurvivalStandard
  components:
  - type: RandomMetadata
    nameSegments:
    - NamesDeathCommandoFirst
    - NamesDeathCommandoLast
  - type: AutoImplant
    implants:
    - DeathAcidifierImplant
  - type: NpcFactionMember
    factions:
    - Syndicate
  mindRoles:
  - MindRolePostOperator

- type: entityTable
  id: BasicAntagEventsTableDeltaV
  table: !type:AllSelector # we need to pass a list of rules, since rules have further restrictions to consider via StationEventComp
    children:
    - id: ListeningPost

- type: entity
  id: ListeningPost
  parent: BaseGameRule
  components:
  - type: StationEvent
    earliestStart: 20
    weight: 2
    minimumPlayers: 40
    maxOccurrences: 1
    duration: null
  - type: RuleGrids
  - type: LoadFarGridRule
    path: /Maps/_Harmony/Nonstations/listening-outpost.yml
    distanceModifier: 13
  - type: DebrisSpawnerRule
    count: 4
    distanceModifier: 5
  # TODO: funny trolling or intel related objectives
  - type: AntagLoadProfileRule
  - type: AntagSelection
    agentName: listening-post-round-end-agent-name
    antags:
    - !type:FixedAntagCount
      proto: SyndicateListener
      count: 2
