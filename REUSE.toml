# REUSE.toml for Sector Vestige.
#
# Ordering matters. Per the REUSE specification, when several [[annotations]]
# tables match a file, ONLY the last matching table in this file is used.
# Generic, repo-wide rules therefore come first; the per-fork rules come last
# so they win for everything under a fork's _Name/ folders.
#
# Verify with `reuse spdx` after editing, not just `reuse lint`. Lint only
# proves every file has some license, not that it is the right one.

version = 1
SPDX-PackageName = "Sector-Vestige"
SPDX-PackageDownloadLocation = "https://github.com/Sector-Vestige/Sector-Vestige"

# ---------------------------------------------------------------------------
# Generic rules: upstream Space Station 14 code and repo tooling (MIT)
# ---------------------------------------------------------------------------

[[annotations]]
path = ["Content.Server/**", "Content.Client/**", "Content.Shared/**"]
precedence = "aggregate"
SPDX-FileCopyrightText = ["2026 Wizards Den contributors", "2026 Sector Vestige contributors (modifications)"]
SPDX-License-Identifier = "MIT"

[[annotations]]
path = [
  "Content.Benchmarks/**", "Content.IntegrationTests/**", "Content.MapRenderer/**",
  "Content.Packaging/**", "Content.PatreonParser/**", "Content.Replay/**",
  "Content.Server.Database/**", "Content.Shared.Database/**", "Content.Tests/**",
  "Content.Tools/**", "Content.YAMLLinter/**", "Content.Docfx/**",
  "Tools/**", "Pow3r/**", ".github/**", ".run/**", "BuildChecker/**", "BuildFiles/**",
]
precedence = "aggregate"
SPDX-FileCopyrightText = ["2026 Wizards Den contributors", "2026 Sector Vestige contributors (modifications)"]
SPDX-License-Identifier = "MIT"

[[annotations]]
path = [
  "**.md", "**.txt", "**.nix", "**.lock", "**.toml", "**.sln**", "**.bat", "**.sh",
  "**.py", "**.props", "**.csproj.DotSettings", "**.json",
  ".editorconfig", ".envrc", ".gitattributes", ".gitignore", ".gitmodules",
  "bors.toml", "nuget.config", "global.json", "omnisharp.json", "SpaceStation14.sln",
]
precedence = "aggregate"
SPDX-FileCopyrightText = ["2026 Wizards Den contributors", "2026 Sector Vestige contributors (modifications)"]
SPDX-License-Identifier = "MIT"

# Upstream game data. Textures are handled at the very end of this file.
[[annotations]]
path = [
  "Resources/Prototypes/**", "Resources/ServerInfo/**", "Resources/Locale/**",
  "Resources/Audio/**", "Resources/Changelog/**", "Resources/ConfigPresets/**",
  "Resources/Credits/**", "Resources/Fonts/**", "Resources/IgnoredPrototypes/**",
  "Resources/Maps/**", "Resources/**.yml",
]
precedence = "aggregate"
SPDX-FileCopyrightText = ["2026 Wizards Den contributors", "2026 Sector Vestige contributors (modifications)"]
SPDX-License-Identifier = "MIT"

# ---------------------------------------------------------------------------
# Ported forks. One table per fork, matching every _Name/ folder in the repo
# (Content.*, Resources/Prototypes, Resources/Locale/<lang>, Resources/Maps, ...).
# Keep the license in sync with the fork's own repository.
# ---------------------------------------------------------------------------

[[annotations]]
path = "**/_LateStation/**"
precedence = "aggregate"
SPDX-FileCopyrightText = ["2026 LateStation14 contributors", "2026 Sector Vestige contributors (modifications)"]
SPDX-License-Identifier = "AGPL-3.0-or-later"

[[annotations]]
