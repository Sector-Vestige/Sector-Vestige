SPDX-License-Identifier = "AGPL-3.0-or-later"

# ---------------------------------------------------------------------------
# Textures. Sprites are CC-BY-SA-3.0 regardless of which fork they came from,
# so this comes after the fork tables. The real per-folder license and author
# live in each meta.json; a few folders are CC-BY-NC-SA-3.0.
# ---------------------------------------------------------------------------

[[annotations]]
path = "Resources/Textures/**"
precedence = "aggregate"
SPDX-FileCopyrightText = ["SS14, fork and Sector Vestige contributors (see meta.json in each folder)"]
SPDX-License-Identifier = "CC-BY-SA-3.0"
